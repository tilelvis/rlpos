name: Build Windows Desktop App

# Produces a Windows .msi and .exe (NSIS) installer that wraps the Vite
# web build in a native desktop window (via Tauri) — no browser, no local
# web server needed on the till PC.
#
# Run it manually from the Actions tab ("Run workflow"), or push a tag like
# `v1.0.0` to trigger it automatically. Either way, download the installer
# from the workflow run's "Artifacts" section once it finishes (a few
# minutes — most of that is a one-time Rust/Tauri CLI compile).
#
# Every run gets a unique UTC timestamp baked into both the artifact name
# and the installer filenames themselves, so two different runs can never
# collide or look identical in the Artifacts list or in your Downloads
# folder. The Rust `target/` directory is deliberately NOT cached (see the
# rust-cache step below) — only the crates.io registry is — so every run
# does a full rebuild and bundle from your current checkout. That's the
# fix for the "downloaded a previous build" problem: a cached target/
# directory could let an old compiled binary or an old bundled
# .msi/.exe survive into a run where the source had actually changed.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build timestamp
        shell: pwsh
        run: |
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          echo "BUILD_STAMP=$stamp" >> $env:GITHUB_ENV
          Write-Host "Build stamp: $stamp"

      # Only runs for tag-triggered builds (v1.2.0 etc.) — a manual
      # "Run workflow" click leaves whatever's committed in package.json /
      # tauri.conf.json / constants.js untouched, which is what you want
      # for a quick test build. Tag pushes are treated as the single
      # source of truth for released version numbers, so this step keeps
      # all three places in sync automatically instead of relying on
      # someone to remember to bump them by hand before tagging.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' isn't a plain X.Y.Z version (got '$version') — expected e.g. v1.2.0."
            exit 1
          }
          Write-Host "Building version $version from tag $tag"

          # package.json — Vite/npm's own "version" field.
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 32 | Set-Content package.json

          # src-tauri/tauri.conf.json — the installer's own version, shown
          # in Windows "Apps & Features" and used to detect upgrades.
          $tauriVersionLine = '"version": "' + $version + '"'
          (Get-Content src-tauri/tauri.conf.json -Raw) -replace '"version":\s*"[^"]*"', $tauriVersionLine |
            Set-Content src-tauri/tauri.conf.json

          # src/core/constants.js — shown to the admin in Settings (if
          # wired up there), so support can ask "what version are you
          # on" and get a real answer.
          $constantsLine = "export const APP_VERSION = '" + $version + "';"
          (Get-Content src/core/constants.js -Raw) -replace "export const APP_VERSION = '[^']*';", $constantsLine |
            Set-Content src/core/constants.js

          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      # No separate "npm run build" step here on purpose: `cargo tauri
      # build` below runs it automatically via tauri.conf.json's
      # beforeBuildCommand (npm run build:tauri), which sets
      # TAURI_BUILD=true so the PWA/service-worker plugin is skipped for
      # this build — see the comment in vite.config.js for why that
      # matters. Running `npm run build` a second time here would just
      # produce a dist/ with the service worker back in, which
      # `cargo tauri build` would then silently overwrite anyway.

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # cache-targets: false is deliberate. The default behaviour caches
      # src-tauri/target/ (both the compiled binary AND the bundled
      # .msi/.exe) between runs. That's what let a stale installer slip
      # through: on a cache hit, if the build/bundle step didn't fully
      # regenerate the bundle output for some reason, the previous run's
      # installer file could still be sitting there and get uploaded as
      # if it were fresh. With cache-targets: false, only the downloaded
      # crates (~/.cargo/registry) are cached — every run always compiles
      # and bundles from scratch, at the cost of a few extra minutes.
      - name: Cache Cargo registry (dependencies only — not build output)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      # Belt-and-braces: guarantee the bundle folder is empty before we
      # build, so it's structurally impossible for an old installer file
      # to be sitting there and get picked up by the upload step below.
      - name: Clean previous bundle output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          Write-Host "Bundle directory cleared."

      - name: Build Windows installer
        working-directory: src-tauri
        run: cargo tauri build

      # Stamp the actual installer filenames too, not just the artifact
      # name — so even after downloading, two builds never look
      # identical or overwrite each other on your machine.
      - name: Stamp installer filenames
        shell: pwsh
        run: |
          $stamp = "${{ env.BUILD_STAMP }}"

          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            $newName = "$($_.BaseName)_$stamp$($_.Extension)"
            Rename-Item -Path $_.FullName -NewName $newName
            Write-Host "Renamed to $newName"
          }

          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            $newName = "$($_.BaseName)_$stamp$($_.Extension)"
            Rename-Item -Path $_.FullName -NewName $newName
            Write-Host "Renamed to $newName"
          }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raicilabs-pos-windows-${{ env.APP_VERSION || 'dev' }}-${{ env.BUILD_STAMP }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
