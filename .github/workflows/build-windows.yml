name: Build Raicilabs POS Offline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Verify Vite build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) {
            Write-Error "dist/index.html was not created."
            exit 1
          }

          Write-Host "Vite build successful."
          Get-ChildItem dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Build Windows local server
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"

          go build -ldflags="-s -w" -o server.exe server.go

          if (!(Test-Path "server.exe")) {
            Write-Error "server.exe was not created."
            exit 1
          }

          Write-Host "server.exe created successfully."

      - name: Install go-winres
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@latest

      - name: Prepare Windows launcher
        shell: pwsh
        run: |
          if (!(Test-Path "windows-launcher")) {
            New-Item -ItemType Directory -Force -Path "windows-launcher" | Out-Null
          }

          @"
          module raicilabs-pos-launcher

          go 1.23
          "@ | Set-Content -Path "windows-launcher/go.mod" -Encoding UTF8

          Copy-Item -Force "launcher.go" "windows-launcher/launcher.go"
          Copy-Item -Force "raicilabs-pos.ico" "windows-launcher/raicilabs-pos.ico"

          Write-Host "Windows launcher prepared."

      - name: Generate Windows icon resource
        shell: pwsh
        working-directory: windows-launcher
        run: |
          go-winres simply --icon "raicilabs-pos.ico" --manifest gui

          $resource = Get-ChildItem -Filter "*.syso" | Select-Object -First 1

          if ($null -eq $resource) {
            Write-Error "Windows icon resource was not created."
            exit 1
          }

          Write-Host "Windows resource created:"
          Write-Host $resource.FullName

      - name: Build Windows POS launcher
        shell: pwsh
        working-directory: windows-launcher
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"

          go build -ldflags="-H=windowsgui -s -w" -o "../RaicilabsPOS.exe" .

          if (!(Test-Path "../RaicilabsPOS.exe")) {
            Write-Error "RaicilabsPOS.exe was not created."
            exit 1
          }

          Write-Host "RaicilabsPOS.exe created successfully."

      - name: Verify launcher
        shell: pwsh
        run: |
          if (!(Test-Path "RaicilabsPOS.exe")) {
            Write-Error "Launcher executable is missing."
            exit 1
          }

          $file = Get-Item "RaicilabsPOS.exe"

          Write-Host "Launcher:"
          Write-Host "Name: $($file.Name)"
          Write-Host "Size: $($file.Length) bytes"

      - name: Create portable POS package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Raicilabs POS/app" | Out-Null

          Copy-Item -Recurse -Force "dist/*" "Raicilabs POS/app/"

          Copy-Item -Force "server.exe" "Raicilabs POS/server.exe"

          Copy-Item -Force "RaicilabsPOS.exe" "Raicilabs POS/Raicilabs POS.exe"

          Write-Host ""
          Write-Host "Portable POS package:"
          Get-ChildItem -Recurse "Raicilabs POS"

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "Raicilabs POS" `
            -DestinationPath "Raicilabs-POS-Offline-Windows.zip" `
            -Force

          Write-Host "Package created:"
          Get-Item "Raicilabs-POS-Offline-Windows.zip"

      - name: Upload portable POS
        uses: actions/upload-artifact@v4
        with:
          name: raicilabs-pos-offline-windows
          path: Raicilabs-POS-Offline-Windows.zip
          if-no-files-found: error
