<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Raicilabs POS — login to printed receipt in under 30 seconds. WebUSB thermal printer ready." />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Raicilabs POS" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Raicilabs POS</title>

  <!-- PWA theme color -->
  <meta name="theme-color" content="#C0392B" />

  <!-- Google Fonts: Inter (UI) + Material Symbols Outlined (icons) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    rel="stylesheet"
  />

  <style>
    /* Loading screen — shown until the JS bundle boots the auth gate.
       Mirrors the Flutter app's loading screen visually. */
    html, body { margin: 0; padding: 0; background: #F7F4EE; height: 100%; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1F1B16;
      background: #F7F4EE;
      transition: opacity 0.4s ease;
      z-index: 9999;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .logo {
      width: 88px; height: 88px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    #loading .logo img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    #loading h1 { font-size: 18px; margin: 0 0 4px 0; font-weight: 700; }
    #loading p { font-size: 12px; margin: 0; color: #6B6357; }
    #loading .spinner {
      margin-top: 18px;
      width: 24px; height: 24px;
      border: 2px solid #E2DBCE;
      border-top-color: #C0392B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo"><img src="icons/Icon-512.png" alt="Raicilabs POS logo" /></div>
    <h1>Raicilabs POS</h1>
    <p>Loading sales terminal…</p>
    <div class="spinner"></div>
  </div>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
