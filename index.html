<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Raicilabs POS — login to printed receipt in under 30 seconds. WebUSB thermal printer ready." />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Raicilabs POS" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Raicilabs POS</title>

  <!-- PWA theme color -->
  <meta name="theme-color" content="#33475A" />

  <!-- Fonts are self-hosted (see src/main.js -> @fontsource/inter) and
       bundled into the build output — no Google Fonts CDN request is
       made at runtime, so the app works fully offline from first load.
       Icons are inline SVG (src/core/icons.js), not a web font, so no
       icon font is loaded at all. -->

  <!-- Applied synchronously, before first paint, so a dark-mode user
       never sees a flash of the light theme while the JS module
       loads. ThemeService (core/services/theme_service.js) re-applies
       this on boot and owns all writes after this point. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('raicilabs.theme');
        var mode = raw ? JSON.parse(raw) : 'light';
        document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <style>
    /* Loading screen — shown until the JS bundle boots the auth gate.
       Mirrors the Flutter app's loading screen visually. */
    html, body { margin: 0; padding: 0; background: #F5F4F0; height: 100%; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #24231F;
      background: #F5F4F0;
      transition: opacity 0.4s ease;
      z-index: 9999;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .logo {
      width: 88px; height: 88px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    #loading .logo img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    #loading h1 { font-size: 18px; margin: 0 0 4px 0; font-weight: 700; }
    #loading p { font-size: 12px; margin: 0; color: #79766D; }
    #loading .spinner {
      margin-top: 18px;
      width: 24px; height: 24px;
      border: 2px solid #E3E0D8;
      border-top-color: #33475A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    html[data-theme="dark"], html[data-theme="dark"] body { background: #1B1A17; }
    html[data-theme="dark"] #loading { background: #1B1A17; color: #E8E6DE; }
    html[data-theme="dark"] #loading p { color: #948F82; }
    html[data-theme="dark"] #loading .spinner { border-color: #37352F; border-top-color: #7A94A8; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo"><img src="icons/Icon-512.png" alt="Raicilabs POS logo" /></div>
    <h1>Raicilabs POS</h1>
    <p>Loading sales terminal…</p>
    <div class="spinner"></div>
  </div>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
