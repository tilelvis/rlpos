[package]
name = "raicilabs-pos"
version = "1.0.0"
description = "Raicilabs POS — desktop wrapper (Tauri) around the Vite web build"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "raicilabs-pos"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
